<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Multi envíos · EnvíaFácil</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--laar:#FCE200;--laarD:#E4C201;--ink:#0F0F0F;--mut:#6b6b6b;--bg:#f5f5f5;--card:#fff;--line:#e4e4e4;--err:#dc2626;--mor:#7c6fdd;--morS:#EEEDFE;--morT:#3C3489}
*{box-sizing:border-box;margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--ink);padding:14px 14px 96px;max-width:460px;margin:0 auto}
.head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--laar);display:flex;align-items:center;justify-content:center;font-size:22px}
.head h1{font-size:17px}.head p{font-size:12px;color:var(--mut);margin-top:2px}
.prog{display:flex;gap:6px;margin-bottom:12px}
.prog .dot{flex:1;height:5px;border-radius:3px;background:#e4e4e4}
.prog .dot.on{background:var(--laar)}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(20,60,70,.06);margin-bottom:12px}
.step{font-size:11px;color:#8a7500;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
.seccion{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 10px}
.lbl,label{font-size:13px;font-weight:600;margin-bottom:8px;display:block}
label .req{color:var(--err)} label .op{font-weight:400;color:var(--mut);font-size:11.5px}
.tipos{display:flex;gap:10px}
.tipo{flex:1;border:2px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer;transition:.15s;background:#fff}
.tipo .ic{font-size:30px}.tipo .t{font-size:14px;font-weight:600;margin-top:6px}
.tipo.sel{border-color:var(--laar);background:#FFFBE0;box-shadow:0 0 0 3px rgba(252,226,0,.3)}
.fld{margin-bottom:14px;position:relative}
input,select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;outline:none;background:#fff}
input:focus{border-color:var(--laar)}
input.bad,input.invalid{border-color:#e11d48;background:#fff5f5}
.errp,.errmsg{color:#e11d48;font-size:12px;margin-top:4px;display:none}
.sug{position:absolute;left:0;right:0;top:100%;z-index:9;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:4px;max-height:230px;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.12);display:none}
.sug.show{display:block}
.sug div{padding:10px 13px;font-size:14px;cursor:pointer;border-bottom:1px solid #f0f5f6}
.sug div:hover{background:#FFFBE0}.sug .pv{font-size:11px;color:var(--mut)}
.sug .empty{color:var(--mut);cursor:default}
.chosen{display:flex;align-items:center;gap:8px;padding:11px 13px;background:#FFFBE0;border:1.5px solid var(--laar);border-radius:11px;font-size:14px;font-weight:600}
.chosen .pv{font-size:11px;color:var(--mut);font-weight:400}
.chosen .x{margin-left:auto;color:#8a7500;cursor:pointer;font-weight:700}
.row{display:flex;gap:10px;align-items:flex-end}.row .fld{flex:1}
.hint{font-size:11px;color:var(--mut);margin-top:4px}
.mapbtn{width:100%;height:48px;border-radius:12px;border:2px solid var(--laarD);background:#FFFBEA;color:var(--ink);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px}
.barra .inner{max-width:460px;margin:0 auto;display:flex;gap:10px}
.btn{width:100%;padding:15px;border:none;border-radius:13px;background:var(--laar);color:var(--ink);font-size:16px;font-weight:700;cursor:pointer}
.btn:disabled{background:#efe6a8;cursor:not-allowed}
.btn.sec{background:#fff;border:1.5px solid var(--line)}
.btn.ok{background:#0F9D58;color:#fff}
.add{width:100%;background:var(--morS);border:2px dashed var(--mor);color:var(--morT);border-radius:13px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px}
.banner{background:var(--morS);border:1px solid #AFA9EC;color:var(--morT);border-radius:11px;padding:12px;font-size:13.5px;margin-bottom:12px}
.conf-item{padding:11px 0;border-bottom:1px solid var(--line)}
.conf-item .k{font-size:12px;color:var(--mut)}
.conf-item .v{font-size:15px;font-weight:600;margin-top:2px;word-break:break-word}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div class="barra"><div class="inner" id="barra"></div></div>

<!-- MODAL MAPA (copiado de index.html) -->
<div id="efMapModal" class="hidden" style="position:fixed;inset:0;z-index:99999;background:#fff;display:flex;flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:0.5px solid #e4e4e4">
    <span style="font-size:16px;font-weight:600">Seleccionar ubicación</span>
    <span id="efMapClose" style="font-size:24px;color:#8a8a8a;cursor:pointer;line-height:1">&times;</span>
  </div>
  <div style="position:relative;flex:1;min-height:200px">
    <div id="efLeaf" style="position:absolute;inset:0"></div>
    <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);pointer-events:none;font-size:38px;line-height:1;z-index:500">📍</div>
    <button type="button" id="efMiUbic" aria-label="mi ubicación" style="position:absolute;right:14px;bottom:20px;width:46px;height:46px;border-radius:50%;background:#fff;border:0.5px solid #ddd;font-size:20px;z-index:500;cursor:pointer">🎯</button>
    <div style="position:absolute;top:10px;left:10px;right:10px;z-index:600">
      <input id="efSearch" type="text" autocomplete="off" placeholder="Busca ciudad, calle o referencia" style="width:100%;height:42px;border-radius:10px;border:none;padding:0 12px;font-size:14px;box-shadow:0 1px 6px rgba(0,0,0,.25);box-sizing:border-box"/>
      <div id="efSug" style="background:#fff;border-radius:10px;margin-top:4px;box-shadow:0 2px 8px rgba(0,0,0,.2);overflow:hidden;display:none;max-height:220px;overflow-y:auto"></div>
    </div>
  </div>
  <div style="padding:14px 16px;border-top:0.5px solid #e4e4e4">
    <div id="efCov" style="font-size:12px;margin-bottom:6px;color:#888">Mueve el mapa para ubicar el pin</div>
    <div id="efAddr" style="font-size:14px;font-weight:600;margin-bottom:12px;min-height:20px;color:#0f0f0f"></div>
    <button type="button" id="efMapConfirm" style="width:100%;height:48px;border-radius:24px;background:#FCE200;border:none;color:#0F0F0F;font-weight:600;font-size:15px;cursor:pointer">Confirmar ubicación</button>
  </div>
</div>

function search(k){var q=norm((document.getElementById('q'+k)||{}).value||'');var box=document.getElementById('sug'+k);if(!box)return;
 if(q.length<2){box.classList.remove('show');return;}
 var hits=CAT.filter(function(c){return norm(c[0]).includes(q)||norm(c[2]).includes(q);}).sort(function(a,b){var A=norm(a[0]).indexOf(q),B=norm(b[0]).indexOf(q);if(A<0)A=99;if(B<0)B=99;return A-B;}).slice(0,30);
 if(!hits.length){box.innerHTML='<div class="empty">Sin resultados</div>';box.classList.add('show');return;}
 box.innerHTML=hits.map(function(c){return '<div onclick="choose(\''+k+'\',\''+c[1]+'\','+JSON.stringify(c[0]).replace(/"/g,'&quot;')+',\''+c[2]+'\')"><span style="font-weight:600">'+c[0]+'</span> <span style="font-weight:600;color:#7a6a00">· '+c[2]+'</span></div>';}).join('');

// ===== validación cédula/RUC + correo (copiado de index.html) =====
function _ced10(v){if(v.length!==10)return false;var d=v.split("").map(Number),prov=+v.slice(0,2);if(prov<1||prov>24)return false;var suma=0;for(var i=0;i<9;i++){var x=d[i]*(i%2===0?2:1);suma+=x>9?x-9:x;}return ((10-suma%10)%10)===d[9];}
function _mod11(v,coef){var s=0;for(var i=0;i<coef.length;i++)s+=(+v[i])*coef[i];var r=11-(s%11);if(r===11)r=0;return r;}
function _rucOk(v){if(v.length!==13)return false;var prov=+v.slice(0,2);if(prov<1||prov>24)return false;var t=+v[2];if(t<6)return _ced10(v.slice(0,10))&&(+v.slice(10))>0;if(t===6)return _mod11(v,[3,2,7,6,5,4,3,2])===(+v[8])||(+v.slice(9))>0;if(t===9)return _mod11(v,[4,3,2,7,6,5,4,3,2])===(+v[9])||(+v.slice(10))>0;return false;}
function cedulaOk(v){v=(v||"").replace(/\D/g,"");if(v.length===10)return _ced10(v);if(v.length===13)return _rucOk(v);return false;}
function correoOk(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);}

  +'<div class="fld"><label>Calle secundaria <span class="req">*</span></label><input id="calle_secundaria" placeholder="Calle secundaria" value="'+(d.calle_secundaria||'')+'"><div class="errmsg" id="e_calle_secundaria">Ingresa la calle secundaria.</div></div>'
  +'<div class="fld"><label>'+refLbl+'</label><input id="referencia" placeholder="Punto de referencia" value="'+(d.referencia||'')+'"><div class="errmsg" id="e_referencia">Ingresa un punto de referencia.</div><div class="hint">Ej: edificio azul, junto al parque…</div></div>';}

function mapHeaderHTML(d){d=d||{};return '<div class="fld"><button type="button" class="mapbtn" onclick="efOpenMapa()">📍 Seleccionar ubicación en el mapa</button><div class="hint">Ubica el pin y autocompletamos ciudad y dirección. Luego completa lo que falte.</div><input type="hidden" id="ef_lat" value="'+(d.lat||'')+'"><input type="hidden" id="ef_lon" value="'+(d.lon||'')+'"></div>';}
function efMatchCiudad(nombre,prov){var nn=norm(nombre),np=norm(prov||'');if(!nn)return null;var cands=CAT.filter(function(c){return norm(c[0])===nn;});if(!cands.length)cands=CAT.filter(function(c){return norm(c[0]).indexOf(nn)>=0||nn.indexOf(norm(c[0]))>=0;});if(np){var byp=cands.filter(function(c){return norm(c[2])===np;});if(byp.length)return byp[0];}return cands[0]||null;}
function leerPersona(){return {cedula:val("cedula"),nombre:val("nombre"),correo:val("correo"),celular:val("celular"),calle_principal:val("calle_principal"),numero_casa:val("numero_casa"),calle_secundaria:val("calle_secundaria"),referencia:val("referencia"),lat:val("ef_lat"),lon:val("ef_lon")};}
function validarPersona(role){var dest=(role==='dest');var ok=true;
 var cVal=val("cedula");if(dest&&cVal===""){setErr("cedula",false);}else{var c=cedulaOk(cVal);setErr("cedula",!c);ok=ok&&c;}
 var nOk=val("nombre").length>=3;setErr("nombre",!nOk);ok=ok&&nOk;
 var ev=val("correo");if(dest&&ev===""){setErr("correo",false);}else{var e=correoOk(ev);setErr("correo",!e);ok=ok&&e;}
 var cv=val("celular");if(dest&&cv===""){setErr("celular",false);}else{var ce=/^\d{10,15}$/.test(cv);setErr("celular",!ce);ok=ok&&ce;}
 var a=val("calle_principal").length>=2;setErr("calle_principal",!a);ok=ok&&a;
 var b=val("numero_casa").length>=1;setErr("numero_casa",!b);ok=ok&&b;
 var s=val("calle_secundaria").length>=1;setErr("calle_secundaria",!s);ok=ok&&s;
 var r=val("referencia").length>=3;setErr("referencia",!r);ok=ok&&r;
 return ok;}

function prog(n){var t=['Remitente','Envío','Destinatario','Resumen'];return '<div class="prog">'+t.map(function(_,i){return '<div class="dot'+(i<=n?' on':'')+'"></div>';}).join('')+'</div>';}

// ===== PANTALLA 0: REMITENTE (solo ciudad de retiro + datos del remitente) =====
function scrRemitente(){sel.Des=null;window._efCiudadKey='Ret';var d=estado.remitente||{};sel.Ret=(estado.remitente&&estado.remitente.ciudad)?estado.remitente.ciudad:null;
 app('<div class="head"><div class="logo">📦</div><div><h1>Multi envíos</h1><p>Un solo retiro · varios destinos</p></div></div>'
  +prog(0)
  +'<div class="card"><div class="step">Remitente · de dónde retiramos</div>'
  +mapHeaderHTML(d)
  +ciudadHTML('Ret','📍 Ciudad de retiro','Escribe tu ciudad...')
  +personaHTML('rem',d)+'</div>');
 barra('<button class="btn" id="btn">Continuar</button>');
 _recheck=function(){};
 document.getElementById('btn').onclick=function(){
   if(!sel.Ret){efAviso('Elige la ciudad de retiro (o ubícala en el mapa).');return;}
   if(!validarPersona('rem'))return;
   estado.remitente=Object.assign({ciudad:sel.Ret},leerPersona());
   if(!estado.envios.length)estado.envios.push(nuevoEnvio());
   estado.idx=0;scrEnvio(0);
 };}

// ===== PANTALLA 1 (por destino): DATOS DEL ENVÍO =====
function scrEnvio(i){var e=estado.envios[i];window._efCiudadKey=null;
 app('<div class="head"><div class="logo">📦</div><div><h1>Destino '+(i+1)+'</h1><p>Página 1 · ¿Qué vas a enviar?</p></div></div>'
  +prog(1)
  +'<div class="card"><div class="step">¿Qué vas a enviar?</div><div class="tipos">'
  +'<div class="tipo" data-tipo="documento" data-id="201202002001002" onclick="pickTipo(this)"><div class="ic">📄</div><div class="t">Documento</div></div>'
  +'<div class="tipo" data-tipo="paquete" data-id="201202002002013" onclick="pickTipo(this)"><div class="ic">📦</div><div class="t">Paquete</div></div></div>'
  +'<div id="fld_piezas" class="fld hidden" style="margin-top:14px"><label class="lbl">📦 Número de piezas</label><input id="piezas" type="number" inputmode="numeric" min="1" max="100" value="'+(e.piezas||1)+'"></div>'
  +'<div id="paqFields" class="hidden"><div class="row"><div class="fld"><label class="lbl">⚖️ Peso (kg) — máx 50/pieza</label><input id="peso" type="text" inputmode="decimal" placeholder="1 a 50 kg" value="'+(e.peso||'')+'" oninput="chkPeso()"><div id="pesoerr" class="errp">⚠️ El peso máximo es 50 kg por pieza.</div></div>'
  +'<div class="fld"><label class="lbl">💵 Valor declarado</label><input id="valor" type="number" inputmode="numeric" min="0" placeholder="USD" value="'+(e.valor||'')+'"></div></div>'
  +'<div class="fld"><label class="lbl">📦 Tipo de contenido <span class="req">*</span></label><input id="contenido" type="text" maxlength="60" placeholder="Escribe qué contiene (ej. ropa, zapatos)" value="'+(e.contenido||'')+'"><div class="hint">Descríbelo tú mismo, no uses términos genéricos.</div></div></div>'
  +'</div>');
 barra('<button class="btn sec" id="atras" style="flex:0 0 40%">Atrás</button><button class="btn" id="btn">Continuar</button>');
 // restaurar tipo elegido
 if(e.tipo){var tile=document.querySelector('.tipo[data-tipo="'+e.tipo+'"]');if(tile)pickTipo(tile);}
 _recheck=function(){document.getElementById('btn').disabled=!(window._selTipo);};recheck();
 document.getElementById('atras').onclick=function(){window._selTipo=null;if(i===0)scrRemitente();else scrMas();};
 document.getElementById('btn').onclick=function(){
   if(!window._selTipo){efAviso('Elige Documento o Paquete.');return;}
   var paq=window._selTipo.tipo==='paquete';
   var piezas=paq?parseInt(val('piezas')||'1',10):1;
   var peso=paq?parseFloat((val('peso')||'0').replace(',','.')):2;
   var valor=paq?parseFloat((val('valor')||'0').replace(',','.')):0;
   var contenido=paq?val('contenido'):'Documentos';
   if(paq&&!(piezas>=1)){efAviso('Indica el número de piezas (mínimo 1).');return;}
   if(paq&&!(peso>=1)){efAviso('Indica el peso en kg (mínimo 1).');return;}
   if(paq&&peso>50*piezas){efAviso('El peso máximo es 50 kg por pieza.');return;}
   if(paq&&!(valor>0)){efAviso('Indica el valor declarado (mayor a 0).');return;}
   if(paq&&contenido.length<3){efAviso('Escribe qué contiene (mínimo 3 letras).');return;}
   e.tipo=window._selTipo.tipo;e.idServicio=window._selTipo.id;
   e.piezas=piezas;e.peso=peso;e.valor=valor;e.contenido=contenido;
   window._selTipo=null;scrDest(i);
 };}
function pickTipo(el){document.querySelectorAll('.tipo').forEach(function(t){t.classList.remove('sel');});el.classList.add('sel');
 window._selTipo={tipo:el.dataset.tipo,id:el.dataset.id};var paq=el.dataset.tipo==='paquete';
 document.getElementById('paqFields').classList.toggle('hidden',!paq);document.getElementById('fld_piezas').classList.toggle('hidden',!paq);recheck();}
function chkPeso(){var el=document.getElementById('peso');if(!el)return;var v=parseFloat((el.value||'0').replace(',','.'));var pz=parseInt((document.getElementById('piezas')||{}).value||'1')||1;var bad=v>50*pz;el.classList.toggle('bad',bad);var e=document.getElementById('pesoerr');if(e)e.style.display=bad?'block':'none';}

// ===== PANTALLA 2 (por destino): DATOS DEL DESTINATARIO =====
function scrDest(i){var e=estado.envios[i];window._efCiudadKey='Des';sel.Des=e.ciudad||null;sel.Ret=estado.remitente?estado.remitente.ciudad:null;
 app('<div class="head"><div class="logo">📦</div><div><h1>Destino '+(i+1)+'</h1><p>Página 2 · Destinatario y destino</p></div></div>'
  +prog(2)+'<div class="card">'+mapHeaderHTML(e.dest)+ciudadHTML('Des','🎯 Ciudad de destino','Escribe la ciudad destino...')+personaHTML('dest',e.dest)+'</div>');
 barra('<button class="btn sec" id="atras" style="flex:0 0 40%">Atrás</button><button class="btn" id="btn">Continuar</button>');
 _recheck=function(){};
 document.getElementById('atras').onclick=function(){e.dest=leerPersona();scrEnvio(i);};
 document.getElementById('btn').onclick=function(){if(!sel.Des){efAviso('Elige la ciudad de destino (o ubícala en el mapa).');return;}if(!validarPersona('dest'))return;e.ciudad=sel.Des;e.dest=leerPersona();scrResumen(i);};}

// ===== PANTALLA 3 (por destino): RESUMEN + CONFIRMAR/EDITAR =====
function itm(k,v){return v?'<div class="conf-item"><div class="k">'+k+'</div><div class="v">'+String(v).replace(/</g,'&lt;')+'</div></div>':'';}
function scrResumen(i){var e=estado.envios[i];var d=e.dest;var dir=d.calle_principal+' '+d.numero_casa+(d.calle_secundaria?' y '+d.calle_secundaria:'');
 var tipoL=e.tipo==='paquete'?'Paquete':'Documento';
 app('<div class="head"><div class="logo">📦</div><div><h1>Destino '+(i+1)+'</h1><p>Revisa y confirma</p></div></div>'
  +prog(3)
  +'<div class="banner">📋 <b>Revisa que todo esté correcto.</b> Si está bien, confirma. Si no, edítalo.</div>'
  +'<div class="card"><div class="step">Envío</div>'
  +itm('Tipo',tipoL)+itm('Ciudad de destino',e.ciudad.name+' ('+e.ciudad.prov+')')
  +(e.tipo==='paquete'?itm('Piezas',e.piezas)+itm('Peso',e.peso+' kg')+itm('Valor declarado','$'+e.valor)+itm('Contenido',e.contenido):'')
  +'</div>'
  +'<div class="card"><div class="step">Destinatario</div>'
  +itm('Cédula / RUC',d.cedula)+itm('Nombres',d.nombre)+itm('Correo',d.correo)+itm('Celular',d.celular)
  +itm('Dirección de entrega',dir)+itm('Referencia',d.referencia)+'</div>');
 barra('<button class="btn sec" id="editar" style="flex:0 0 40%">✏️ Editar</button><button class="btn ok" id="btn">✅ Confirmar destino</button>');
 document.getElementById('editar').onclick=function(){scrEnvio(i);};
 document.getElementById('btn').onclick=function(){e.confirmado=true;scrMas();};}

// ===== PANTALLA MÁS: ¿otro destino o terminar? =====
function scrMas(){var n=estado.envios.filter(function(e){return e.confirmado;}).length;
 var lst=estado.envios.map(function(e,i){if(!e.confirmado)return '';return '<div class="conf-item"><div class="k">Destino '+(i+1)+'</div><div class="v">'+e.ciudad.name+' ('+e.ciudad.prov+') · '+(e.tipo==='paquete'?'Paquete':'Documento')+' · '+e.dest.nombre+'</div></div>';}).join('');
 app('<div class="head"><div class="logo">📦</div><div><h1>Multi envíos</h1><p>'+n+' destino(s) listo(s)</p></div></div>'
  +'<div class="card"><div class="step">Destinos confirmados</div>'+lst+'</div>'
  +'<div class="add" onclick="agregarDestino()">➕ Agregar otro destino</div>');
 barra('<button class="btn ok" id="btn">✅ Terminar y enviar ('+n+')</button>');
 document.getElementById('btn').onclick=enviar;}
function agregarDestino(){estado.envios.push(nuevoEnvio());estado.idx=estado.envios.length-1;window._selTipo=null;sel.Des=null;scrEnvio(estado.idx);}

// ===== ENVIAR (callback) =====
function payload(){var r=estado.remitente;
 return {executionId:executionId,success:true,
  remitente:{ciudad:r.ciudad.name,ciudadCodigo:r.ciudad.code,provincia:r.ciudad.prov,cedula:r.cedula,nombre:r.nombre,correo:r.correo,celular:r.celular,calle_principal:r.calle_principal,numero_casa:r.numero_casa,calle_secundaria:r.calle_secundaria,referencia:r.referencia,lat:r.lat,lon:r.lon},
  envios:estado.envios.filter(function(e){return e.confirmado;}).map(function(e){var d=e.dest;return {idServicio:e.idServicio,tipo:e.tipo==='paquete'?'Paquete':'Documento',ciudad:e.ciudad.name,ciudadCodigo:e.ciudad.code,provincia:e.ciudad.prov,piezas:e.piezas,peso:e.peso,valor:e.valor,contenido:e.contenido,cedula:d.cedula,nombre:d.nombre,correo:d.correo,celular:d.celular,calle_principal:d.calle_principal,numero_casa:d.numero_casa,calle_secundaria:d.calle_secundaria,referencia:d.referencia,lat:d.lat,lon:d.lon};})};}
function enviar(){var body=payload();
 if(!executionId){document.body.innerHTML='<div style="padding:24px;max-width:460px;margin:0 auto"><h2>✅ Vista de prueba (sin bot)</h2><p style="color:#6b6b6b">Este es el JSON que se enviaría al bot:</p><pre style="background:#111;color:#0f0;padding:14px;border-radius:10px;overflow:auto;font-size:12px">'+JSON.stringify(body,null,2)+'</pre></div>';return;}
 document.body.innerHTML='<div style="text-align:center;padding:70px 22px"><div style="font-size:56px">⏳</div><h2 style="margin-top:8px">Enviando tu multienvío…</h2></div>';
 fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(function(r){return r.json().catch(function(){return {};});}).then(function(){
    document.body.innerHTML='<div style="text-align:center;padding:70px 22px"><div style="font-size:56px">✅</div><h2 style="margin-top:8px">¡Listo!</h2><p style="color:#6b6b6b;margin-top:8px">Tu multienvío está en WhatsApp 📦<br><span style="font-size:13px;color:#9b9b9b">Cerrando…</span></p></div>';
    setTimeout(function(){window.location.href='https://wa.me/'+WA;},1500);
  }).catch(function(){document.body.innerHTML='<div style="text-align:center;padding:70px 22px"><div style="font-size:56px">⚠️</div><h2 style="margin-top:8px">No se pudo enviar</h2><p style="color:#6b6b6b;margin-top:8px">Inténtalo de nuevo.</p></div>';});}

function efAviso(msg){var old=document.getElementById('efAvisoBox');if(old)old.remove();var b=document.createElement('div');b.id='efAvisoBox';b.style.cssText='position:fixed;left:14px;right:14px;bottom:74px;background:#FFF3F3;border:1.5px solid #E88;color:#a00;border-radius:10px;padding:11px 13px;font-size:14px;font-weight:600;z-index:5000;max-width:432px;margin:0 auto;text-align:center';b.textContent='⚠️ '+msg;document.body.appendChild(b);setTimeout(function(){if(b)b.remove();},3500);}

scrRemitente();
</script>

<!-- MAPA: lógica (copiada de index.html), expone efOpenMapa() =====-->
<script>
(function(){
  var modal=document.getElementById('efMapModal'),map=null,geoT=null;
  var DEF=[-0.180653,-78.467834];
  function setV(id,v){var el=document.getElementById(id);if(el&&v)el.value=v;}
  function openM(){modal.classList.remove('hidden');
    if(!map){map=L.map('efLeaf',{zoomControl:true}).setView(DEF,16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
      map.on('moveend',onMove);tryLoc();}
    setTimeout(function(){map.invalidateSize();onMove();},250);}
  window.efOpenMapa=openM;
  function closeM(){modal.classList.add('hidden');}
  function onMove(){var sg=document.getElementById('efSug');if(sg)sg.style.display='none';var c=map.getCenter();
    document.getElementById('efAddr').textContent='Ubicando…';document.getElementById('efCov').textContent='';
    clearTimeout(geoT);geoT=setTimeout(function(){revGeo(c.lat,c.lng);},450);}
  function revGeo(lat,lon){fetch('https://enviafacil-geocode.fn.jelou.ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lat:lat,lon:lon})})
    .then(function(r){return r.json();}).then(function(d){var a=document.getElementById('efAddr'),cov=document.getElementById('efCov');
      if(d&&d.ok){window._efGeo={lat:lat,lon:lon,calle:d.calle||'',sector:d.sector||'',ciudad:d.ciudad||'',prov:d.provincia||''};
        a.textContent=d.formatted||((d.calle||'')+', '+(d.ciudad||''));
        if(d.ciudad){cov.textContent='✅ '+d.ciudad+', '+(d.provincia||'');cov.style.color='#0f6e56';}else{cov.textContent='⚠️ No pudimos identificar la zona';cov.style.color='#a00';}
      }else{a.textContent='No pudimos leer la dirección aquí';window._efGeo=null;}
    }).catch(function(){document.getElementById('efAddr').textContent='Sin conexión al ubicar';});}
  function tryLoc(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(function(p){if(map)map.setView([p.coords.latitude,p.coords.longitude],16);},function(){},{timeout:6000,enableHighAccuracy:true});}
  function confirmLoc(){if(!map){closeM();return;}var c=map.getCenter(),btn=document.getElementById('efMapConfirm');btn.textContent='Confirmando…';btn.disabled=true;
    function done(d){setV('ef_lat',String(c.lat));setV('ef_lon',String(c.lng));
      if(d&&d.ok){var _cp=d.calle||'',_cs=d.sector||'';if(!_cp&&_cs){_cp=_cs;_cs='';}if(_cs&&_cp&&_cs.trim().toLowerCase()===_cp.trim().toLowerCase())_cs='';if(!_cp&&d.formatted)_cp=String(d.formatted).split(',')[0].trim();if(_cp)setV('calle_principal',_cp);if(_cs)setV('calle_secundaria',_cs);
        if(window._efCiudadKey&&d.ciudad){var mc=efMatchCiudad(d.ciudad,d.provincia);if(mc)choose(window._efCiudadKey,mc[1],mc[0],mc[2]);}}
      btn.textContent='Confirmar ubicación';btn.disabled=false;closeM();}
    fetch('https://enviafacil-geocode.fn.jelou.ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lat:c.lat,lon:c.lng})}).then(function(r){return r.json();}).then(done).catch(function(){done(null);});}
  var FN='https://enviafacil-geocode.fn.jelou.ai',srchT=null,sess='ef-'+Date.now()+'-'+Math.floor(Math.random()*1e6);
  function doSearch(q){var bias=map?(map.getCenter().lat+','+map.getCenter().lng):'';
    fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:q,session:sess,bias:bias})}).then(function(r){return r.json();}).then(function(d){var sug=document.getElementById('efSug');
      if(!d.ok||!d.predictions||!d.predictions.length){sug.style.display='none';return;}sug.innerHTML='';
      d.predictions.forEach(function(p){var row=document.createElement('div');row.style.cssText='padding:10px 12px;border-bottom:0.5px solid #eee;cursor:pointer';row.innerHTML='<div style="font-weight:600;font-size:13px">'+(p.main||p.description)+'</div>'+(p.sec?'<div style="color:#888;font-size:12px">'+p.sec+'</div>':'');row.addEventListener('click',function(){pickPlace(p.place_id,p.description);});sug.appendChild(row);});
      sug.style.display='block';}).catch(function(){var sg=document.getElementById('efSug');if(sg)sg.style.display='none';});}
  function pickPlace(pid,desc){var sug=document.getElementById('efSug');sug.style.display='none';document.getElementById('efSearch').value=desc;
    fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({place_id:pid,session:sess})}).then(function(r){return r.json();}).then(function(d){sess='ef-'+Date.now()+'-'+Math.floor(Math.random()*1e6);if(d.ok&&d.lat&&d.lon&&map){map.setView([parseFloat(d.lat),parseFloat(d.lon)],17);}}).catch(function(){});}
  (function(){var inp=document.getElementById('efSearch');if(!inp)return;inp.addEventListener('input',function(){var q=inp.value.trim();clearTimeout(srchT);if(q.length<3){document.getElementById('efSug').style.display='none';return;}srchT=setTimeout(function(){doSearch(q);},320);});})();
  document.getElementById('efMapClose').addEventListener('click',closeM);
  document.getElementById('efMapConfirm').addEventListener('click',confirmLoc);
  document.getElementById('efMiUbic').addEventListener('click',tryLoc);
})();
</script>
</body>
