<!doctype html>
<html lang="es-EC">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envía Fácil · LAARCOURIER</title>
<meta name="description" content="Cotiza, paga y agenda tu recolección puerta a puerta a nivel nacional.">
<!-- Dirección del servicio Envía Fácil web (servidor de LAARCOURIER). Pruebas: :9755 · Producción: :9754 -->
<meta name="ef-api" content="https://api.laarcourier.com:9755">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Envía Fácil web — pieza 4 (2-oct-2026). Diseño aprobado por LAAR (propuesta/index.html) + lógica del bot.
   Un destino en esta versión; MULTIENVÍOS va en la siguiente. Sin mapa (opción c). La página solo habla con
   nuestro servicio (enviafacil-web-backend), que es el único que llama a la API de LAAR, Nuvei y DeUna. */
:root{--negro:#000000;--amarillo:#FCE200;--gris:#E5E7EB;--borde:#D1D5DB;--blanco:#FFFFFF;--suave:rgba(0,0,0,.72)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Poppins',sans-serif;background:var(--blanco);color:var(--negro);-webkit-text-size-adjust:100%}
a{color:var(--negro)}
button{font-family:'Poppins',sans-serif;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--negro);outline-offset:2px}
[hidden]{display:none!important}
.lb{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.lb .op{font-weight:400}
.in{display:block;width:100%;height:50px;border:1.5px solid var(--borde);border-radius:10px;padding:0 14px;font:500 16px 'Poppins',sans-serif;color:var(--negro);background:var(--blanco);outline:none}
.in:focus{border-color:var(--negro);box-shadow:0 0 0 3px var(--amarillo)}
.in.err{border:2px solid var(--negro)}
.in[readonly]{background:var(--gris)}
.hint{font-size:12px;line-height:1.45;color:var(--suave);margin:6px 0 0}
.msg{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:8px 10px;background:var(--amarillo);border-radius:8px;font-size:13px;font-weight:500;line-height:1.4}
.msg::before,.alerta-t::before{content:"!";flex-shrink:0;width:18px;height:18px;border-radius:50%;background:var(--negro);color:var(--amarillo);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.bp,.bs,.bx{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border-radius:12px;font-size:16px;font-weight:700;text-decoration:none;text-align:center}
.bp{min-height:54px;padding:12px 20px;border:0;background:var(--amarillo);color:var(--negro)}
.bp:hover{box-shadow:inset 0 0 0 2px var(--negro)}
.bs{min-height:50px;padding:10px 20px;border:1.5px solid var(--negro);background:var(--blanco);color:var(--negro);font-size:15px;font-weight:600}
.bp[disabled],.bs[disabled]{background:var(--gris);color:rgba(0,0,0,.55);cursor:not-allowed;box-shadow:none}
.bp[aria-busy=true]{cursor:progress}
.link{min-height:44px;border:0;background:transparent;color:var(--negro);font-size:14px;font-weight:600;text-decoration:underline;width:100%}
.spin{width:18px;height:18px;border:2.5px solid rgba(0,0,0,.25);border-top-color:var(--negro);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.pila{display:flex;flex-direction:column;gap:18px}
.pila10{display:flex;flex-direction:column;gap:10px}
.dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.h1{margin:0;font-size:24px;font-weight:700;line-height:1.2}
.sub{font-size:14px;margin:6px 0 22px}
.opc{min-height:50px;border-radius:10px;border:1.5px solid var(--negro);background:var(--blanco);color:var(--negro);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 10px}
.opc[aria-pressed=true]{background:var(--negro);color:var(--blanco)}
.opc[disabled]{border-color:var(--borde);color:rgba(0,0,0,.4);cursor:not-allowed}
.radio{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:12px;border:1.5px solid var(--borde);background:var(--blanco);color:var(--negro);width:100%}
.radio[aria-checked=true],.radio[aria-pressed=true]{border:2px solid var(--negro)}
.radio .pt{flex-shrink:0;margin-top:2px;width:20px;height:20px;border-radius:50%;border:2px solid var(--negro);display:flex;align-items:center;justify-content:center}
.radio .pt::after{content:"";width:10px;height:10px;border-radius:50%}
.radio[aria-checked=true] .pt::after,.radio[aria-pressed=true] .pt::after{background:var(--negro)}
.radio .tx{display:flex;flex-direction:column;gap:3px}
.radio .t1{font-size:15px;font-weight:700}
.radio .t2{font-size:13px;font-weight:500;color:var(--suave)}
.caja{border:1.5px solid var(--borde);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.caja .tt{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px}
.fila{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.fila span:first-child{color:var(--suave)}
.fila span:last-child{font-weight:600;text-align:right;overflow-wrap:anywhere}
.sep{display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px dashed var(--borde)}
.nota{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:2px solid var(--negro);border-radius:12px;font-size:13px;font-weight:500;line-height:1.5}
.nota::before{content:"!";flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--negro);color:var(--amarillo);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.reloj{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--amarillo);font-size:14px;font-weight:600}
.alerta{border:2px solid var(--negro);border-radius:12px;overflow:hidden}
.alerta-t{background:var(--amarillo);padding:12px 14px;font-size:14px;font-weight:700;display:flex;gap:10px;align-items:center}
.alerta-c{padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.5}
.alerta-c p{margin:0}

/* Autocompletar de ciudades */
.ac{position:relative}
.ac ul{position:absolute;z-index:5;left:0;right:0;top:54px;margin:0;padding:4px;list-style:none;background:var(--blanco);border:1.5px solid var(--negro);border-radius:10px;max-height:260px;overflow:auto;box-shadow:0 12px 24px rgba(0,0,0,.12)}
.ac li button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:8px;font-size:15px;font-weight:600;color:var(--negro)}
.ac li button:hover,.ac li button:focus{background:var(--gris)}
.ac li small{display:block;font-size:12px;font-weight:500;color:var(--suave)}
.ac li.vacio{padding:10px 12px;font-size:14px;color:var(--suave)}

/* Cabecera del sitio y barra Envía Fácil */
.sitio{background:var(--negro);height:52px;padding:0 20px;display:flex;align-items:center}
.sitio img{height:21px;width:auto;display:block}
.barra{background:var(--amarillo);min-height:56px;display:flex;align-items:center;gap:8px;padding:0 20px}
.barra img{height:26px;width:auto;display:block}
.atras{width:44px;height:44px;margin-left:-10px;border:0;background:transparent;color:var(--negro);display:flex;align-items:center;justify-content:center}

/* Entrada */
.hero{background:var(--negro);color:var(--blanco)}
.hero-in{display:flex;flex-direction:column;padding:32px 20px 28px;gap:20px}
.hero-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.chip{align-self:flex-start;border:1.5px solid var(--amarillo);color:var(--amarillo);font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.hero h1{margin:0;font-size:40px;line-height:1.05;font-weight:800;color:var(--amarillo);letter-spacing:-.02em}
.hero p{margin:0;font-size:16px;line-height:1.55}
.hero-bt{display:flex;flex-direction:column;gap:12px;max-width:420px;margin-top:4px}
.hero-bt button{flex-direction:column;align-items:flex-start;gap:2px;min-height:68px;text-align:left}
.hero-bt .b1{font-size:17px;font-weight:700}
.hero-bt .b2{font-size:13px;font-weight:500}
.bo{display:flex;padding:12px 20px;border:1.5px solid var(--blanco);border-radius:12px;background:transparent;color:var(--blanco)}
.bo .b2{color:var(--borde)}
.hero-art{flex-shrink:0;display:flex;justify-content:center;width:100%;max-width:250px;align-self:center}
.hero-art img{display:block;width:100%;height:auto;filter:drop-shadow(0 18px 28px rgba(0,0,0,.35))}
.promesas{display:flex;flex-direction:column;gap:18px;padding:24px 20px}
.prom{display:flex;gap:12px;align-items:flex-start}
.prom .ic{flex-shrink:0;width:36px;height:36px;border-radius:10px;background:var(--amarillo);display:flex;align-items:center;justify-content:center}
.prom p{margin:0}
.prom .t{font-size:15px;font-weight:700}
.pdp{padding:32px 20px 40px}
.pdp-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.pdp-in p{margin:0;font-size:16px;line-height:1.55}
.pdp-a{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;border:1.5px solid var(--borde);border-radius:12px;font-size:15px;font-weight:600;text-decoration:none}

/* Flujo */
.wrap{display:block;padding:20px 20px 28px}
.prog{margin-bottom:20px}
.prog p{margin:0 0 8px;font-size:13px;font-weight:600}
.prog .seg{display:flex;gap:4px}
.prog .seg span{flex:1;height:6px;border-radius:3px;background:var(--gris)}
.prog .seg span.on{background:var(--negro)}
.mini{margin:-4px 0 20px;padding:10px 14px;border-radius:10px;background:var(--gris);display:flex;align-items:center;justify-content:space-between;gap:12px}
.mini span:first-child{font-size:13px;font-weight:500;min-width:0}
.mini span:last-child{font-size:15px;font-weight:700;white-space:nowrap}
.precio{background:var(--negro);color:var(--blanco);border-radius:16px;padding:22px 20px}
.precio .p0{margin:0;font-size:14px;color:var(--borde)}
.precio .p1{margin:2px 0 0;font-size:48px;font-weight:800;color:var(--amarillo);line-height:1.05;letter-spacing:-.02em}
.precio .p2{margin:4px 0 18px;font-size:13px;color:var(--borde)}
.precio .det{border-top:1px solid rgba(209,213,219,.35);padding-top:14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.precio .fila span:first-child{color:var(--borde)}
.total{background:var(--negro);color:var(--blanco);border-radius:14px;padding:16px 18px}
.total .r{display:flex;justify-content:space-between;align-items:center;gap:12px}
.total .r p{margin:0}
.total .v{font-size:32px;font-weight:800;color:var(--amarillo)}
.total .n{margin:10px 0 0;font-size:12px;line-height:1.5;color:var(--borde)}
.codigo{border:2px solid var(--negro);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:center}
.codigo p{margin:0}
.codigo .c{font-size:30px;font-weight:800;letter-spacing:.12em}
.codigo img{width:220px;max-width:100%;height:auto;margin:0 auto;display:block}
.listo-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-bottom:20px}
.listo-top .ok{width:64px;height:64px;border-radius:50%;background:var(--amarillo);display:flex;align-items:center;justify-content:center}
.listo-top p{margin:0;font-size:14px}
.dato{border:1.5px solid var(--borde);border-radius:14px;padding:16px}
.dato p{margin:0}
.dato .k{font-size:12px;font-weight:600;color:var(--suave)}
.dato .v{margin-top:2px;font-size:22px;font-weight:700;letter-spacing:.04em;overflow-wrap:anywhere}
.gris{background:var(--gris);border-radius:12px;padding:14px;font-size:14px;line-height:1.55}
.gris p,.cierre p{margin:0 0 6px}
.cierre{font-size:14px;line-height:1.55}
.aside{display:none}

@media (min-width:900px){
  .sitio{height:64px;padding:0 40px}
  .sitio img{height:26px}
  .barra{padding:0 40px}
  .hero-in{flex-direction:row;align-items:center;padding:72px 80px;gap:56px;max-width:1280px;margin:0 auto}
  .hero h1{font-size:60px}
  .hero-art{width:380px;max-width:380px}
  .promesas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;padding:32px 80px;max-width:1280px;margin:0 auto}
  .pdp{padding:72px 40px 88px}
  .h1{font-size:30px}
  .wrap{max-width:560px;margin:0 auto;padding:48px 40px 64px}
  .wrap.conaside{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:56px;max-width:1080px;padding:40px 40px 56px;align-items:start}
  .mini{display:none}
  .aside{display:block;position:sticky;top:24px;border:1.5px solid var(--borde);border-radius:16px;overflow:hidden;background:var(--blanco)}
  .aside .h{background:var(--negro);color:var(--blanco);padding:14px 20px;font-size:15px;font-weight:600}
  .aside .c{padding:18px 20px;display:flex;flex-direction:column;gap:12px;font-size:14px}
  .aside .tot{border-top:1.5px solid var(--gris);padding-top:12px;display:flex;justify-content:space-between;align-items:baseline}
  .aside .tot span:last-child{font-size:28px;font-weight:800}
}
</style>
</head>
<body>
<header class="sitio">
  <a href="https://www.laarcourier.com/" aria-label="LAARCOURIER, ir al inicio"><img src="marca/laarcourier-fondo-oscuro.svg" alt="LAARCOURIER"></a>
</header>
<div class="barra">
  <button type="button" class="atras" id="atras" aria-label="Volver al paso anterior" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <img src="marca/enviafacil-fondo-amarillo.svg" alt="Envía Fácil">
</div>
<main id="app" aria-live="polite"></main>

<script>
(function () {
"use strict";

// ---------- Configuración ----------
// El servicio vive en el servidor de LAARCOURIER. Para pruebas se puede apuntar a otro con ?api=, solo a direcciones
// conocidas (la Mac, el túnel de pruebas o los dos puertos de LAAR): nadie puede mandar los datos a otro sitio.
var API = (document.querySelector('meta[name="ef-api"]') || {}).content || "";
var PERMITIDAS = /^(http:\/\/(127\.0\.0\.1|localhost)(:\d+)?|https:\/\/[a-z0-9-]+\.trycloudflare\.com|https:\/\/api\.laarcourier\.com:975[45])$/;
(function () {
  var q = new URLSearchParams(location.search).get("api");
  try {
    if (q && PERMITIDAS.test(q.replace(/\/+$/, ""))) localStorage.setItem("ef_web_api", q.replace(/\/+$/, ""));
    var g = localStorage.getItem("ef_web_api");
    if (g && PERMITIDAS.test(g)) API = g;
  } catch (e) {}
})();
var PDP_VERSION = "web-2026-10-02";           // versión del texto de autorización que acepta el cliente
var CLAVE = "ef_web_envio_v1";                 // estado del envío en este navegador (sobrevive la ida a Nuvei)
var PASOS = ["Cotiza", "Envío", "Remitente", "Destinatario", "Confirma", "Paga"];
var PASO_N = { cotizar: 1, precio: 1, entrega: 2, remitente: 3, destinatario: 4, confirmar: 5, pago: 6 };
var ANTERIOR = { cotizar: "entrada", precio: "cotizar", entrega: "precio", remitente: "entrega", destinatario: "remitente", confirmar: "destinatario", pago: "confirmar" };

// ---------- Estado ----------
function nuevo() { return { paso: "entrada", vista: "", entrada: "env", tipo: "paquete", ori: null, des: null, piezas: "1", peso: "", valor: "", contenido: "", celular: "", precio: 0,
  entrega: "domicilio", oficina: null, rem: {}, dst: {}, envioRef: "", total: 0, pdpRegistrado: false, metodo: "", duModo: "", duCobros: {}, duRefs: [], nuveiRef: "", pagadoCon: "" }; }
var E = nuevo();
try { var g0 = JSON.parse(localStorage.getItem(CLAVE) || "null"); if (g0 && g0.paso) E = Object.assign(nuevo(), g0); } catch (e) {}
function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(E)); } catch (e) {} }

// ---------- Utilidades ----------
var app = document.getElementById("app");
function $(id) { return document.getElementById(id); }
function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function norm(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim(); }
function dig(s) { return String(s || "").replace(/\D/g, ""); }
function numero(s) { var n = parseFloat(String(s || "").replace(",", ".")); return isFinite(n) ? n : NaN; }
function dinero(n) { return "$" + Number(n || 0).toFixed(2).replace(".", ","); }
function titulo(s) { return String(s || "").toLowerCase().replace(/(^|[\s(\-])(\S)/g, function (m, a, b) { return a + b.toUpperCase(); }); }
function val(id) { var el = $(id); return el ? el.value.trim() : ""; }
function esPaq() { return E.tipo === "paquete"; }
function rutaTxt() { return (E.ori ? titulo(E.ori.name) : "") + " → " + (E.des ? titulo(E.des.name) : ""); }
function queTxt() {
  if (!esPaq()) return "Documento";
  var p = parseInt(E.piezas, 10) || 1;
  return "Paquete · " + String(E.peso).replace(".", ",") + " kg · " + p + (p === 1 ? " pieza" : " piezas");
}
var timers = [];
function limpiarTimers() { timers.forEach(function (t) { clearInterval(t); clearTimeout(t); }); timers = []; }

async function api(ruta, datos, metodo) {
  var op = { method: metodo || (datos ? "POST" : "GET"), headers: {} };
  if (datos) { op.headers["Content-Type"] = "application/json"; op.body = JSON.stringify(datos); }
  var ctl = new AbortController(); var t = setTimeout(function () { ctl.abort(); }, 45000); op.signal = ctl.signal;
  try {
    var r = await fetch(API + ruta, op);
    var j = await r.json().catch(function () { return {}; });
    if (!j || typeof j !== "object") j = {};
    if (r.status === 429) j.error = "demasiadas_solicitudes";
    return j;
  } catch (e) { return { ok: false, error: "sin_conexion" }; }
  finally { clearTimeout(t); }
}

// Mensaje de error debajo de un campo (mismo estilo amarillo del diseño aprobado).
function marcar(id, texto) {
  var el = $(id); if (!el) return;
  el.classList.toggle("err", !!texto); el.setAttribute("aria-invalid", texto ? "true" : "false");
  var m = $(id + "-msg");
  if (m) { m.textContent = texto || (m.dataset.hint || ""); m.className = texto ? "msg" : "hint"; m.setAttribute("role", texto ? "alert" : ""); m.hidden = !texto && !m.dataset.hint; }
}
function campo(id, etiqueta, valor, extra, ayuda, opcional) {
  return '<div><label class="lb" for="' + id + '">' + etiqueta + (opcional ? ' <span class="op">(opcional)</span>' : "") + '</label>' +
    '<input id="' + id + '" class="in" value="' + esc(valor) + '" ' + (extra || "") + ' aria-describedby="' + id + '-msg">' +
    '<p id="' + id + '-msg" class="hint" data-hint="' + esc(ayuda || "") + '"' + (ayuda ? "" : " hidden") + '>' + esc(ayuda || "") + '</p></div>';
}

// Cédula (10) o RUC (13): misma validación que los formularios del bot (fenix, index.html).
function ced10(v) {
  if (v.length !== 10) return false;
  var d = v.split("").map(Number), prov = +v.slice(0, 2); if (prov < 1 || prov > 24) return false;
  var s = 0; for (var i = 0; i < 9; i++) { var x = d[i] * (i % 2 === 0 ? 2 : 1); s += x > 9 ? x - 9 : x; }
  return ((10 - s % 10) % 10) === d[9];
}
function mod11(v, coef) { var s = 0; for (var i = 0; i < coef.length; i++) s += (+v[i]) * coef[i]; var r = 11 - (s % 11); if (r === 11) r = 0; return r; }
function rucOk(v) {
  if (v.length !== 13) return false;
  var prov = +v.slice(0, 2); if (prov < 1 || prov > 24) return false;
  var t = +v[2];
  if (t < 6) return ced10(v.slice(0, 10)) && (+v.slice(10)) > 0;
  if (t === 6) return mod11(v, [3, 2, 7, 6, 5, 4, 3, 2]) === (+v[8]) || (+v.slice(9)) > 0;
  if (t === 9) return mod11(v, [4, 3, 2, 7, 6, 5, 4, 3, 2]) === (+v[9]) || (+v.slice(10)) > 0;
  return false;
}
function cedulaOk(v) { v = dig(v); return v.length === 10 ? ced10(v) : v.length === 13 ? rucOk(v) : false; }
function correoOk(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function celularOk(v) { return /^09\d{8}$/.test(dig(v)); }

// ---------- Armado de la pantalla ----------

function ir(paso, vista) {

  (PANTALLAS[paso] || PANTALLAS.entrada)();

}

// ---------- 2. Cotizador (mismos datos y orden que el bot: tipo, ciudades, piezas, peso, valor, contenido, celular) ----------
var CIUDADES = null;
async function cargarCiudades() {
  if (CIUDADES) return CIUDADES;
  var r = await api("/catalogo/ciudades");
  if (r && r.ok && Array.isArray(r.ciudades)) CIUDADES = r.ciudades.map(function (c) { return { name: c[0], code: String(c[1]), prov: c[2] || "", n: norm(c[0]) }; });
  return CIUDADES;
}
function autocompletar(id, clave) {
  var inp = $(id), lista = $(id + "-lista");
  function cerrar() { lista.hidden = true; inp.setAttribute("aria-expanded", "false"); }
  function pintar() {
    var q = norm(inp.value);
    if (E[clave] && inp.value !== titulo(E[clave].name)) { E[clave] = null; guardar(); }
    if (q.length < 2 || !CIUDADES) { cerrar(); return; }
    var hits = CIUDADES.filter(function (c) { return c.n.indexOf(q) >= 0; }).slice(0, 30);
    lista.innerHTML = hits.length ? hits.map(function (c, i) {
      return '<li><button type="button" data-i="' + CIUDADES.indexOf(c) + '">' + esc(titulo(c.name)) + "<small>" + esc(titulo(c.prov)) + "</small></button></li>";
    }).join("") : '<li class="vacio">Sin resultados</li>';
    lista.hidden = false; inp.setAttribute("aria-expanded", "true");
  }
  inp.addEventListener("input", pintar);
  inp.addEventListener("focus", pintar);
  lista.addEventListener("mousedown", function (e) { e.preventDefault(); });
  lista.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-i]"); if (!b) return;
    var c = CIUDADES[+b.dataset.i]; E[clave] = { name: c.name, code: c.code, prov: c.prov }; guardar();
    inp.value = titulo(c.name); marcar(id, ""); cerrar();
  });
  inp.addEventListener("blur", function () { setTimeout(cerrar, 150); });
}

PANTALLAS.cotizar = function () {
  var paq = esPaq();
  app.innerHTML = marco(
    '<h2 class="h1">' + (E.entrada === "cot" ? "Cotiza tu envío" : "Arma tu envío") + '</h2><p class="hint sub">Te toma menos de 1 minuto.</p>' +

    '<div class="dos">' + ciudad("c-origen", "Ciudad de origen", E.ori, "Escribe tu ciudad") + ciudad("c-destino", "Ciudad de destino", E.des, "Escribe la ciudad destino") + "</div>" +
    '<p id="c-cat-msg" class="msg" role="alert" hidden></p>' +

    '<div class="dos">' + campo("c-piezas", "Piezas", E.piezas, 'inputmode="numeric" autocomplete="off"', "") + campo("c-peso", "Peso (kg)", E.peso, 'inputmode="decimal" autocomplete="off" placeholder="kg"', "") + "</div>" +
    '<p id="c-pesoayuda" class="hint" style="margin-top:-12px"></p>' +
    campo("c-valor", "Valor declarado (USD)", E.valor, 'inputmode="decimal" autocomplete="off" placeholder="$"', "Cuánto vale lo que envías.") +
    campo("c-cont", "Contenido", E.contenido, 'maxlength="60" autocomplete="off" placeholder="Ej. ropa, zapatos, repuestos"', "") + "</div>" +
    campo("c-cel", "Tu celular", E.celular, 'inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="09XXXXXXXX"', "Aquí te avisamos cuando recolectemos y entreguemos.") +
    '<div style="margin-top:6px"><p id="c-err" class="msg" role="alert" hidden></p><button type="button" class="bp" id="ver">Ver precio</button></div></div>');

  function ayudaPeso() {
    var p = parseInt(val("c-piezas"), 10);
    $("c-pesoayuda").textContent = p >= 1 ? "Máximo 50 kg por pieza: con " + p + (p === 1 ? " pieza, hasta 50 kg." : " piezas, hasta " + (50 * p) + " kg en total.") : "Máximo 50 kg por pieza.";
  }
  ayudaPeso();
  $("c-piezas").addEventListener("input", function () { ayudaPeso(); marcar("c-peso", ""); });
  ["c-piezas", "c-peso", "c-valor", "c-cont", "c-cel"].forEach(function (id) { $(id).addEventListener("input", function () { marcar(id, ""); $("c-err").hidden = true; }); });
  function tipo(t) {
    E.tipo = t; guardar();
    $("t-doc").setAttribute("aria-pressed", t === "documento"); $("t-paq").setAttribute("aria-pressed", t === "paquete");
    $("c-paq").hidden = t !== "paquete";
  }
  $("t-doc").onclick = function () { tipo("documento"); };
  $("t-paq").onclick = function () { tipo("paquete"); };

  cargarCiudades().then(function (c) {
    if (!c) { var m = $("c-cat-msg"); if (m) { m.textContent = "No pudimos cargar las ciudades. Revisa tu conexión y vuelve a intentar."; m.hidden = false; } return; }
    autocompletar("c-origen", "ori"); autocompletar("c-destino", "des");
  });

  $("ver").onclick = async function () {
    var ok = true, paqA = esPaq();
    if (!E.ori) { marcar("c-origen", "Elige tu ciudad de la lista."); ok = false; }
    if (!E.des) { marcar("c-destino", "Elige la ciudad de destino de la lista."); ok = false; }
    var piezas = parseInt(val("c-piezas"), 10), peso = numero(val("c-peso")), valor = numero(val("c-valor")), cont = val("c-cont"), cel = dig(val("c-cel"));
    if (paqA) {
      if (!(piezas >= 1) || String(piezas) !== dig(val("c-piezas"))) { marcar("c-piezas", "Indica el número de piezas (mínimo 1)."); ok = false; }
      if (!(peso >= 1)) { marcar("c-peso", "Indica el peso en kg (mínimo 1)."); ok = false; }
      else if (piezas >= 1 && peso > 50 * piezas) { marcar("c-peso", "El peso máximo es 50 kg por pieza."); ok = false; }
      if (!(valor > 0)) { marcar("c-valor", "Indica el valor declarado del paquete (debe ser mayor a 0)."); ok = false; }
      if (cont.length < 3) { marcar("c-cont", "Escribe qué contiene tu paquete (mínimo 3 letras)."); ok = false; }
    }
    if (!celularOk(cel)) { marcar("c-cel", cel.length && cel.length < 10 ? "Te falta un número. Tu celular tiene 10 dígitos y empieza con 09." : "Tu celular tiene 10 dígitos y empieza con 09."); ok = false; }
    if (!ok) { var p = app.querySelector(".err"); if (p) p.focus(); return; }
    E.piezas = paqA ? String(piezas) : "1"; E.peso = paqA ? String(peso) : ""; E.valor = paqA ? String(valor) : ""; E.contenido = paqA ? cont : "";
    E.celular = cel; E.envioRef = ""; E.total = 0; guardar();
    var b = this; b.disabled = true; b.setAttribute("aria-busy", "true"); b.innerHTML = '<span class="spin"></span>Calculando tu precio…';
    var r = await api("/envio/precio", { envio: armarEnvio(true) });
    b.disabled = false; b.removeAttribute("aria-busy"); b.textContent = "Ver precio";
    if (r.ok && r.total > 0) { E.precio = r.total; ir("precio"); return; }
    var e = $("c-err"); e.hidden = false;
    e.textContent = r.error === "sin_conexion" ? "No pudimos conectarnos. Revisa tu conexión y vuelve a intentar."
      : r.error === "demasiadas_solicitudes" ? "Hiciste muchas consultas seguidas. Espera un minuto y vuelve a intentar."
      : r.error === "datos_incompletos" ? "Revisa los datos: " + (r.falta || []).join(", ") + "."
      : "No pudimos calcular el precio de esta ruta. Revisa los datos o intenta más tarde.";
  };
};
function ciudad(id, etiqueta, sel, ph) {
  return '<div class="ac"><label class="lb" for="' + id + '">' + etiqueta + '</label><input id="' + id + '" class="in" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="' + id +

var ICONO_DOC = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>';
var ICONO_PAQ = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>';

// El envío tal como lo espera el servicio (mismos nombres de campo que los formularios del bot).
function armarEnvio(soloPrecio) {
  var paq = esPaq(), r = E.rem || {}, d = E.dst || {}, ofi = E.entrega === "oficina" && E.oficina;
  var envio = {
    celular: E.celular,
    remitente: { ciudadCodigo: E.ori && E.ori.code, ciudadNombre: E.ori && E.ori.name },
    destinos: [{ tipo: paq ? "paquete" : "documento", piezas: paq ? Number(E.piezas) : 1, peso: paq ? Number(E.peso) : 2, valorDeclarado: paq ? Number(E.valor) : 0,
      contenido: paq ? E.contenido : "Documentos", destinatario: { ciudadCodigo: E.des && E.des.code, ciudadNombre: E.des && E.des.name } }]
  };
  if (soloPrecio) return envio;
  Object.assign(envio.remitente, { nombres_completos: r.nombre, cedula: dig(r.cedula), correo: r.correo, celular: dig(r.celular), telefono: dig(r.celular),
    calle_principal: r.calle, numero_casa: r.num, calle_secundaria: r.sec, referencia_recoleccion: r.ref });
  Object.assign(envio.destinos[0].destinatario, { nombres_completos: d.nombre, cedula: dig(d.cedula), correo: d.correo || "", celular: dig(d.celular), lat: "", lon: "",
    calle_principal: ofi ? "" : d.calle, numero_casa: ofi ? "" : d.num, calle_secundaria: ofi ? "" : d.sec, referencia_recoleccion: ofi ? "" : d.ref });
  if (ofi) { envio.destinos[0].isRetiro = true; envio.destinos[0].idOficina = String(E.oficina.id); }
  return envio;
}

  function pintarOficinas() {

    if (!lista) { cont.innerHTML = '<p class="hint" style="display:flex;gap:8px;align-items:center;margin:0"><span class="spin"></span>Buscando oficinas…</p>'; return; }
    if (!lista.length) { cont.innerHTML = '<div class="alerta"><div class="alerta-t">No tenemos oficinas LAAR en ' + esc(titulo(E.des.name)) + '</div><div class="alerta-c"><p>Elige la entrega a domicilio.</p></div></div>'; return; }
    cont.innerHTML = '<p class="hint" style="margin:0;font-size:14px">El destinatario retirará el paquete en la agencia que elijas.</p>' +
      '<div><label class="lb" for="o-ciudad">Ciudad de retiro</label><input id="o-ciudad" class="in" value="' + esc(titulo(E.des.name)) + '" readonly></div>' +
      '<div><span class="lb" id="o-lista">Elige la oficina</span><div role="radiogroup" aria-labelledby="o-lista" class="pila10">' +
      lista.map(function (o, i) {
        var sel = E.oficina && String(E.oficina.id) === String(o.id);
        var hor = o.horarioApertura && o.horarioCierre ? "Atiende de " + o.horarioApertura + " a " + o.horarioCierre : "";
        return '<button type="button" class="radio" role="radio" aria-checked="' + !!sel + '" data-i="' + i + '"><span class="pt" aria-hidden="true"></span><span class="tx"><span class="t1">' + esc(o.nombre.replace(/\s+/g, " ")) +
          '</span><span class="t2">' + esc(o.direccion) + "</span>" + (hor ? '<span class="t2">' + esc(hor) + "</span>" : "") + "</span></button>";
      }).join("") + "</div></div>";
    cont.querySelectorAll("button[data-i]").forEach(function (b) {

        cont.querySelectorAll("button[data-i]").forEach(function (x) { x.setAttribute("aria-checked", x === b); }); $("e-err").hidden = true;
      };
    });
  }

// ---------- 5. Remitente / 6. Destinatario (mismos campos y reglas que los formularios del bot) ----------
function formPersona(p, pre, destino, ofi) {
  return '<div class="pila">' +
    campo(pre + "-id", "Cédula o RUC", p.cedula || "", 'inputmode="numeric" maxlength="13" autocomplete="off" placeholder="10 dígitos (cédula) o 13 (RUC)"', "", destino) +
    campo(pre + "-nom", "Nombres y apellidos", p.nombre || "", 'autocomplete="' + (destino ? "off" : "name") + '" maxlength="100"', "") +
    campo(pre + "-mail", "Correo", p.correo || "", 'type="email" inputmode="email" autocomplete="' + (destino ? "off" : "email") + '" maxlength="100" placeholder="correo@ejemplo.com"',
      destino ? "" : "Aquí te llega tu factura.", destino) +
    campo(pre + "-cel", "Celular", p.celular || "", 'inputmode="numeric" maxlength="10" autocomplete="' + (destino ? "off" : "tel-national") + '" placeholder="09XXXXXXXX"', destino ? "" : "Lo trajimos de tu cotización.") +
    (ofi ? "" :
      campo(pre + "-calle", "Calle principal", p.calle || "", 'maxlength="100" placeholder="Av. / Calle principal"', "") +
      bloqueVivienda(p, pre) +
      campo(pre + "-sec", "Calle secundaria", p.sec || "", 'maxlength="100" placeholder="Calle secundaria"', "") +
      campo(pre + "-ref", "Referencia", p.ref || "", 'maxlength="100" placeholder="Punto de referencia (ej.: portón blanco, frente a la tienda)"', "")) + "</div>";
}
// Tipo de vivienda: tomado del formulario de Servicio a Domicilio de InterLAB (JC, 2-oct-2026: «en todos los formularios
// después de solicitar envío»; sin mapa). LAAR recibe la dirección en 4 campos: calle principal, número, calle secundaria y
// referencia. Lo de la vivienda se junta en el campo «número» (≤ 100 caracteres, el tope de la recolección).
var VIVIENDAS = ["Casa", "Departamento", "Urbanización o conjunto"];
function bloqueVivienda(p, pre) {
  var v = p.viv || "";
  function chico(id, et, valor, max, ph, opc) { return campo(pre + id, et, valor || "", 'maxlength="' + max + '" placeholder="' + ph + '"', "", opc); }
  return '<div><label class="lb" for="' + pre + '-viv">Tipo de vivienda</label><select id="' + pre + '-viv" class="in" aria-describedby="' + pre + '-viv-msg">' +
    '<option value="">Elige…</option>' + VIVIENDAS.map(function (x) { return "<option" + (x === v ? " selected" : "") + ">" + x + "</option>"; }).join("") + "</select>" +
    '<p id="' + pre + '-viv-msg" class="hint" data-hint="Estos datos le sirven al courier para llegar sin llamar.">Estos datos le sirven al courier para llegar sin llamar.</p></div>' +
    '<div id="' + pre + '-b-casa"' + (v === "Casa" ? "" : " hidden") + ">" + chico("-numCasa", "Número de casa", p.numCasa, 20, "Ej.: 12 · Mz. 4 solar 7") + "</div>" +
    '<div id="' + pre + '-b-depto" class="pila"' + (v === "Departamento" ? "" : " hidden") + ">" + chico("-edificio", "Edificio", p.edificio, 40, "Ej.: Torres del Río", true) +
    '<div class="dos">' + chico("-piso", "Piso", p.piso, 5, "Ej.: 3") + chico("-numDepto", "N.º de departamento", p.numDepto, 10, "Ej.: 4B") + "</div></div>" +
    '<div id="' + pre + '-b-urb" class="pila"' + (v === "Urbanización o conjunto" ? "" : " hidden") + ">" + chico("-urbNombre", "Nombre de la urbanización o conjunto", p.urbNombre, 40, "Ej.: Villa Club") +
    '<div class="dos" style="grid-template-columns:repeat(3,minmax(0,1fr));align-items:end">' + chico("-urbEtapa", "Etapa", p.urbEtapa, 5, "Ej.: 3", true) + chico("-urbManzana", "Manzana", p.urbManzana, 10, "Ej.: 14") +
    chico("-urbVilla", "Villa", p.urbVilla, 10, "Ej.: 7") + "</div></div>";
}
function activarVivienda(pre) {
  var sel = $(pre + "-viv"); if (!sel) return;
  sel.addEventListener("change", function () {
    marcar(pre + "-viv", "");
    $(pre + "-b-casa").hidden = sel.value !== "Casa"; $(pre + "-b-depto").hidden = sel.value !== "Departamento"; $(pre + "-b-urb").hidden = sel.value !== "Urbanización o conjunto";
  });
}
function leerPersona(pre, destino, ofi) {
  var p = { cedula: dig(val(pre + "-id")), nombre: val(pre + "-nom").replace(/\s+/g, " "), correo: val(pre + "-mail").replace(/\s+/g, ""), celular: dig(val(pre + "-cel")) };
  var ok = true;
  function f(id, mal, texto) { if (mal) { marcar(id, texto); ok = false; } else marcar(id, ""); }
  f(pre + "-id", !(destino && !p.cedula) && !cedulaOk(p.cedula), "Revisa el número: la cédula tiene 10 dígitos y el RUC 13.");
  f(pre + "-nom", p.nombre.length < 3, "Escribe los nombres y apellidos.");
  f(pre + "-mail", !(destino && !p.correo) && !correoOk(p.correo), "Revisa el correo. Por ejemplo: nombre@gmail.com");
  f(pre + "-cel", destino ? !/^\d{10}$/.test(p.celular) : !celularOk(p.celular), "El celular tiene 10 dígitos y empieza con 09.");
  if (!ofi) {
    p.calle = val(pre + "-calle"); p.sec = val(pre + "-sec"); p.ref = val(pre + "-ref"); p.viv = val(pre + "-viv");
    ["numCasa", "edificio", "piso", "numDepto", "urbNombre", "urbEtapa", "urbManzana", "urbVilla"].forEach(function (k) { p[k] = val(pre + "-" + k); });
    f(pre + "-calle", p.calle.length < 2, "Escribe la calle principal.");
    f(pre + "-viv", !p.viv, "Elige el tipo de vivienda.");
    if (p.viv === "Casa") { f(pre + "-numCasa", p.numCasa.length < 1, "Escribe el número de casa (si no tiene, escribe S/N)."); p.num = p.numCasa; }
    if (p.viv === "Departamento") {
      f(pre + "-piso", p.piso.length < 1, "Falta el piso."); f(pre + "-numDepto", p.numDepto.length < 1, "Falta el departamento.");
      p.num = [p.edificio ? "Edif. " + p.edificio : "", "piso " + p.piso, "dpto. " + p.numDepto].filter(Boolean).join(", ");
    }
    if (p.viv === "Urbanización o conjunto") {
      f(pre + "-urbNombre", p.urbNombre.length < 2, "Escribe el nombre de la urbanización o conjunto.");
      f(pre + "-urbManzana", p.urbManzana.length < 1, "Falta la manzana."); f(pre + "-urbVilla", p.urbVilla.length < 1, "Falta la villa.");
      p.num = ["Urb. " + p.urbNombre, p.urbEtapa ? "etapa " + p.urbEtapa : "", "Mz. " + p.urbManzana, "villa " + p.urbVilla].filter(Boolean).join(", ");
    }
    f(pre + "-sec", p.sec.length < 1, "Escribe la calle secundaria.");
    f(pre + "-ref", p.ref.length < 3, "Escribe una referencia para encontrar la dirección.");
  }

  return ok ? p : null;
}
function limpiarAlEscribir() { app.querySelectorAll(".in").forEach(function (el) { el.addEventListener("input", function () { marcar(el.id, ""); }); }); activarVivienda("r"); activarVivienda("d"); }

PANTALLAS.remitente = function () {

  app.innerHTML = marco('<h2 class="h1">¿Quién envía?</h2><p class="hint sub">Aquí recolectamos tu paquete, en ' + esc(titulo(E.ori.name)) + ".</p>" +

PANTALLAS.destinatario = function () {

function errorPago(r) {

    : r.error === "sin_conexion" ? "No pudimos conectarnos. Revisa tu conexión y vuelve a intentar."
    : r.error === "demasiadas_solicitudes" ? "Hiciste muchos intentos seguidos. Espera un minuto y vuelve a intentar."
    : "No pudimos iniciar el pago. Intenta de nuevo en un momento.";

async function revisarSiYaPago() {
  var s = await api("/envio/estado", { referencia: E.envioRef });
  if (s.ok && s.estado && s.estado !== "cotizado") { E.pagadoCon = E.pagadoCon || E.metodo; guardar(); ir("listo"); }
}
async function cobroDeUna(modo, otro) {
  E.duModo = modo; guardar();
  $("du-app").setAttribute("aria-pressed", modo === "app"); $("du-cod").setAttribute("aria-pressed", modo === "cod");
  // Un cobro por opción mientras siga vigente (DeUna: enlace/QR 30 min; código de 6 dígitos 3 min fijos).
  var c = (E.duCobros || {})[modo];
  if (c && !otro && Date.now() < c.vence) { pintarDeUna(); return; }
  $("p-err").hidden = true;
  $("du-cuerpo").innerHTML = '<p class="hint" style="display:flex;gap:8px;align-items:center;margin:0"><span class="spin"></span>' + (modo === "cod" ? "Generando tu código…" : "Generando tu cobro con DeUna…") + "</p>";
  var r = await api("/deuna/crear-cobro", modo === "cod" ? { envioRef: E.envioRef, modo: "codigo" } : { envioRef: E.envioRef });
  if (!r.ok || (modo === "cod" ? !r.codigo : !(r.enlace || r.qr))) { $("du-cuerpo").innerHTML = ""; errorPago(r.ok ? {} : r); return; }
  E.duCobros = E.duCobros || {}; E.duRefs = E.duRefs || [];
  E.duCobros[modo] = { ref: r.referencia, enlace: r.enlace || "", qr: r.qr || "", codigo: r.codigo || "", vence: Date.now() + (r.expiraMin || 3) * 60000 };
  E.duRefs.push(r.referencia); guardar();
  pintarDeUna();
}
var cuentaT = null;
function pintarDeUna() {
  clearInterval(cuentaT);

  var c = (E.duCobros || {})[E.duModo]; if (!c) { cuerpo.innerHTML = ""; return; }
  var espera = '<p class="hint" style="margin:0;font-size:14px">⏳ Después de pagar, espera unos segundos en esta página: estaré generando tu guía, factura y recolección automáticamente.</p>';
  if (E.duModo === "cod") {
    var vencido = Date.now() >= c.vence;
    cuerpo.innerHTML = '<div class="codigo"><p style="font-size:13px;font-weight:600">Su código para completar la transacción es:</p><p class="c"' + (vencido ? ' style="text-decoration:line-through;opacity:.4"' : "") + ">" +
      esc(String(c.codigo).replace(/^(\d{3})(\d{3})$/, "$1 $2")) + "</p>" +
      (vencido ? '<p style="font-size:13px;font-weight:700">Este código ya venció.</p><button type="button" class="bp" id="du-nuevo">Generar un código nuevo</button>'
        : '<p style="font-size:13px;font-weight:500;line-height:1.5">📲 Ábrelo en tu app de <strong>DeUna</strong> o <strong>Banco Pichincha</strong>, elige pagar con código e ingrésalo.</p>' +
          '<p class="hint" style="margin:0;font-size:13px" id="du-vence"></p>' + espera) + "</div>";
    if (vencido) $("du-nuevo").onclick = function () { cobroDeUna("cod", true); };
    else {
      var cuenta = function () {
        var s = Math.max(0, Math.round((c.vence - Date.now()) / 1000)), el = $("du-vence");
        if (!el) return; if (!s) return pintarDeUna();
        el.textContent = "Este código vence en " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + " minutos.";
      };
      clearInterval(cuentaT); cuenta(); cuentaT = setInterval(cuenta, 1000); timers.push(cuentaT);
    }
  } else {
    var movil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    var qr = c.qr ? (String(c.qr).indexOf("data:") === 0 ? c.qr : "data:image/png;base64," + c.qr) : "";
    cuerpo.innerHTML = '<div class="pila10">' +
      (c.enlace ? '<a class="bp" href="' + esc(c.enlace) + '" target="_blank" rel="noopener">Pagar ' + dinero(E.total) + " con DeUna</a>" : "") +
      (!movil && qr ? '<div class="codigo"><p style="font-size:13px;font-weight:600">O escanea este código QR con la app DeUna:</p><img alt="Código QR de pago DeUna" src="' + esc(qr) + '"></div>' : "") + espera + "</div>";
  }
  vigilarDeUna();
}
// Se vigilan TODOS los cobros DeUna abiertos de este envío: si el cliente cambió de opción y pagó con la otra, igual se detecta.
var vigilando = null;
function vigilarDeUna() {
  if (vigilando) return;
  vigilando = setInterval(async function () {
    if (E.paso !== "pago" || !(E.duRefs || []).length) { clearInterval(vigilando); vigilando = null; return; }
    for (var k = 0; k < E.duRefs.length; k++) {
      var r = await api("/deuna/estado", { referencia: E.duRefs[k] });
      if (r.ok && r.estado === "pagado") { clearInterval(vigilando); vigilando = null; E.pagadoCon = "du"; guardar(); ir("listo"); return; }
    }
  }, 5000);
}
// Vuelta de Nuvei: el pago se confirma en el servicio (aviso de Nuvei); aquí solo se espera el resultado.
function esperarNuvei() {
  var inicio = Date.now();
  app.innerHTML = marco('<h2 class="h1">Método de pago</h2><div id="nv" style="margin-top:20px"><p class="hint" style="display:flex;gap:8px;align-items:center;font-size:14px"><span class="spin"></span>Estamos confirmando tu pago con tarjeta…</p></div>');
  async function revisar() {
    var r = await api("/nuvei/estado", { referencia: E.nuveiRef || E.envioRef });
    if (r.ok && r.estado === "pagado") { limpiarTimers(); E.pagadoCon = "tc"; E.vista = ""; guardar(); ir("listo"); return; }
    var s = await api("/envio/estado", { referencia: E.envioRef });
    if (s.ok && s.estado && s.estado !== "cotizado") { limpiarTimers(); E.pagadoCon = "tc"; E.vista = ""; guardar(); ir("listo"); return; }
    if (Date.now() - inicio > 90000 && $("nv")) {
      $("nv").innerHTML = '<div role="status" class="caja" style="border:2px solid var(--negro);font-size:14px;line-height:1.55;gap:6px"><p style="margin:0;font-weight:700">⏳ Estamos confirmando tu pago.</p>' +
        '<p style="margin:0">Tu transacción aún se está procesando, así que <strong>no vuelvas a pagar.</strong> Un asesor de LAAR lo verifica y te confirma en un momento.</p>' +
        '<p class="hint" style="margin:0">Referencia: ' + esc(E.envioRef) + "</p></div>";
    }
  }
  revisar();
  timers.push(setInterval(revisar, 5000));
}

// ---------- 9. Listo (lo mismo que el bot envía después del pago, en el mismo orden) ----------
PANTALLAS.listo = function () {
  if (!E.envioRef) return ir("entrada");
  var inicio = Date.now();
  app.innerHTML = '<div class="wrap" id="listo"><p class="hint" style="display:flex;gap:8px;align-items:center;font-size:14px"><span class="spin"></span>Estamos generando tu guía, factura y recolección…</p></div>';
  async function revisar() {
    var s = await api("/envio/estado", { referencia: E.envioRef });
    if (s.ok && (s.estado === "emitido" || s.estado === "emitido_con_fallas")) { limpiarTimers(); pintar(s); return; }
    if (Date.now() - inicio > 180000) {
      limpiarTimers();
      $("listo").innerHTML = '<div class="caja" role="status" style="border:2px solid var(--negro);font-size:14px;line-height:1.55"><p style="margin:0;font-weight:700">Tu pago está registrado.</p>' +
        '<p style="margin:0">Estamos terminando de generar tu guía y tu factura. Guarda esta referencia: <strong>' + esc(E.envioRef) + "</strong></p></div>" +
        '<button type="button" class="bs" id="reintentar" style="margin-top:16px">Volver a revisar</button>';
      $("reintentar").onclick = function () { ir("listo"); };
    }
  }
  revisar();
  timers.push(setInterval(revisar, 4000));
  function pintar(s) {
    var res = s.resultado || {}, guias = (res.guias || []).filter(function (g) { return g && g.guia; });
    var rec = res.recoleccion && res.recoleccion.ok ? res.recoleccion.id : "";
    var fac = res.factura && res.factura.ok && res.factura.pdf ? API + res.factura.pdf : "";
    var etq = guias.length ? API + "/etiqueta/" + E.envioRef + ".pdf" : "";
    $("listo").innerHTML = '<div class="listo-top"><span class="ok"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>' +
      '<p style="margin-top:4px;font-weight:600">' + (E.pagadoCon === "du" ? "💳 Tu pago ha sido registrado exitosamente." : "💳 Tu pago se ha completado exitosamente.") + "</p>" +
      '<p style="font-weight:500">✨ Gracias por confiar en <strong>LAARCOURIER</strong>.</p>' +
      '<h2 class="h1" style="margin-top:8px">🎉 ¡Listo! ' + esc(E.rem.nombre) + ", tu pago fue confirmado y tu envío ya está en marcha.</h2></div>" +
      '<div class="pila10" style="margin-bottom:16px">' +
      guias.map(function (g) { return '<div class="dato"><p class="k">📦 Guía · a ' + esc(titulo(g.ciudad || E.des.name)) + '</p><p class="v">' + esc(g.guia) + "</p></div>"; }).join("") +
      (guias.length ? '<p class="hint" style="margin:0 4px;font-size:13px">Con este número podrás hacer seguimiento en tiempo real.</p>' : "") +
      (rec ? '<div class="dato"><p class="k">Número de recolección</p><p class="v">' + esc(rec) + "</p></div>" : "") +
      '<p style="margin:0 4px;font-size:14px;font-weight:500">📧 Recibirás tu factura en: <strong>' + esc(E.rem.correo) + "</strong></p>" +
      '<p style="margin:0 4px;font-size:14px;font-weight:500">Nosotros nos encargamos del proceso. Tú solo espera la entrega.</p></div>' +
      (s.estado === "emitido_con_fallas" ? '<div class="nota" role="note" style="margin-bottom:16px"><span>Tu pago está registrado. Si falta algún dato de los de arriba, guarda esta referencia: <strong>' + esc(E.envioRef) + "</strong></span></div>" : "") +
      '<div class="nota" role="note" style="margin-bottom:16px;font-size:14px"><div><p style="margin:0 0 6px"><strong>Importante:</strong> Embala tu paquete correctamente siguiendo estos pasos 👉🏽 <a href="https://www.youtube.com/shorts/PsMoJksKRRc" target="_blank" rel="noopener" style="font-weight:700">ver video</a></p>' +
      '<p style="margin:0">Si tu envío es grande, mira también este video 📦 <a href="https://www.youtube.com/watch?v=_HLwTGJaMnI" target="_blank" rel="noopener" style="font-weight:700">ver video</a></p></div></div>' +
      '<div class="pila10" style="margin-bottom:16px">' +
      (fac ? '<a class="bp" href="' + esc(fac) + '" target="_blank" rel="noopener">' + ICONO_BAJAR + "Descargar factura (PDF)</a>" : "") +
      (etq ? '<a class="bs" href="' + esc(etq) + '" target="_blank" rel="noopener">' + ICONO_BAJAR + "Descargar guía (PDF)</a>" : "") + "</div>" +
      '<div class="gris" style="margin-bottom:16px"><p>Si su solicitud fue previa a las 2pm, recolectaremos esta misma tarde el pedido, si fue después de este horario, al día siguiente hábil.</p>' +
      '<p style="margin:0">Le recomendamos mantenerse atento a su número telefónico y tenga su paquete listo, para el momento del retiro.</p></div>' +
      '<div class="cierre" style="margin-bottom:18px"><p>No necesitas enviarnos ningún documento adicional: tu guía y tu factura ya están emitidas.</p><p>Gracias por confiar en Envía Fácil. 💛</p>' +
      "<p>Para seguimiento y control, puedes usar <strong>Rastrea tu guía</strong> en el menú de laarcourier.com, cuando lo necesites.</p><p style=\"margin:0;font-weight:700\">¡Hasta el próximo envío!</p></div>" +
      '<button type="button" class="bs" id="otro">Hacer otro envío</button>';
    $("otro").onclick = function () { var acepto = E.pdpAcepto; E = nuevo(); E.pdpAcepto = acepto; guardar(); ir("entrada"); };
  }
};
var ICONO_BAJAR = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';

// ---------- Arranque ----------
// Vuelta desde la página de Nuvei: ?nuvei=<referencia>.
var vuelta = new URLSearchParams(location.search).get("nuvei");
if (vuelta && /^EFW-\d{13}-\d{5}$/.test(vuelta) && E.envioRef === vuelta) { E.paso = "pago"; E.vista = "nuvei"; E.metodo = "tc"; }
if (vuelta && history.replaceState) history.replaceState(null, "", location.pathname);
ir(E.paso, E.vista);
})();
</script>

</html>
